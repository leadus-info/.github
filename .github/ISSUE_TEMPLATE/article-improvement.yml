name: 既存記事の問題報告
description: 既存記事の誤り・わかりにくさ・構成の問題を報告する
title: "[改善] "
body:
  - type: markdown
    attributes:
      value: "誤字・脱字・表記ゆれなどの軽微な誤りは、このissueで報告しても、issueを立てずに直接PRで修正しても構いません。"

  - type: input
    id: article
    attributes:
      label: 対象記事
      description: 対象記事へのパス（例：math/advanced/analysis/derivatives.md）を記載してください。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 現状の問題点
      description: goalとの整合性、論理の飛躍、説明不足、requiresとの不整合など、具体的な問題点を記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 改善案
      description: 可能であれば、どのように直すべきかの方向性を記載してください（未定でも可）。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: "起票後、メンテナーが問題の重要度に応じて`impact: 1`（些末な改善余地）〜`impact: 5`（論理破綻・誤った理解に導かれる）のラベルを付けることを理解した"
          required: true
